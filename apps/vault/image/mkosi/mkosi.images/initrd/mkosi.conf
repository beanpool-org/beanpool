# The UKI's initrd: mkosi's own default initrd, built here as a subimage only so that the one thing an x86-64 build on
# another architecture leaves behind (Rosetta's /.cache, from running the packages' scripts) is removed. Without it,
# a build on an arm64 Mac and one on an x86-64 machine would differ in that one empty directory.
[Include]
Include=mkosi-initrd

[Output]
Format=cpio
Output=initrd

[Content]
Locale=C.UTF-8
Timezone=UTC
Hostname=vault
RemoveFiles=/.cache
