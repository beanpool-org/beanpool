# Memory hygiene (host design §5.1 item 6) and a smaller kernel surface. None of this stops the host, which can read
# the machine's memory from outside; it stops the keys leaking to somewhere inside the machine that outlives them.

# No ptrace at all (can't be lowered again until a reboot).
kernel.yama.ptrace_scope = 3
# No core files anywhere: piped to nothing (the keyholder also runs with LimitCORE=0 and refuses otherwise).
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
# No loading of another kernel (a crash kernel would dump memory).
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.perf_event_paranoid = 3
vm.unprivileged_userfaultfd = 0
# The network.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.tcp_syncookies = 1
