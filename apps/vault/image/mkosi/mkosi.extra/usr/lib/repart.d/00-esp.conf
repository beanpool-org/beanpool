# The partitions at the first boot (systemd-repart), after the three the image brings (ESP, system slot A and its
# verity tree): system slot B and its verity tree (empty until the first new image, usr/lib/sysupdate.d), the state
# partition (/var) and the data partition (LUKS2 under K_disk from the first unlock, usr/lib/beanpool-vault/vault-data.mjs).
[Partition]
Type=esp
Label=ESP
SizeMinBytes=512M
SizeMaxBytes=512M
