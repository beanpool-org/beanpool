# /var is the state partition, empty at the first boot: what the vault's services need on it.
d /var/lib/beanpool-vault            0755 root      root             -
d /var/lib/beanpool-vault/data       0700 vault-api vault-api-socket -
d /var/lib/beanpool-vault/releases   0700 vault-api vault-api-socket -
d /var/lib/beanpool-vault/backups    0700 vault-api vault-api-socket -
d /var/lib/beanpool-vault/staged     0700 vault-api vault-api-socket -
d /var/lib/caddy                     0700 caddy     caddy            -
d /var/log/journal                   2755 root      systemd-journal  -
