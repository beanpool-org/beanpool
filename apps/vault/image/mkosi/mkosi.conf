# The vault's image (key vault design §3; host design §5.1 items 5 and 6). Built by ../build.sh, which adds the
# version, the seed, the time and the snapshot's apt sources (mkosi.sandbox/), the programs and Node (mkosi.extra/).
#
# One boot file (a UKI: kernel, initrd, and a command line naming the dm-verity root hash of the read-only system
# partition), booted by systemd-boot from the ESP. No SSH server, no login: root is locked and no getty runs.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=beanpool-vault
Output=beanpool-vault
SplitArtifacts=uki,partitions
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# EFI/Linux/beanpool-vault_<version>.efi: the name systemd-sysupdate and the release's staged files use.
UnifiedKernelImageFormat=beanpool-vault_%v
# lockdown=confidentiality: not even root can read kernel memory (/dev/mem, /proc/kcore, kprobes, BPF reads).
# init_on_free=1: freed pages are zeroed, so a key wiped late is not left behind. No hibernation, no crash kernel.
KernelCommandLine=console=ttyS0,115200 console=tty0 lockdown=confidentiality init_on_free=1 nohibernate panic=30 systemd.show_status=error
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-cryptsetup
        systemd-container
        systemd-timesyncd
        udev
        dbus-broker
        linux-image-cloud-amd64
        kmod
        nftables
        dnsmasq-base
        caddy
        ca-certificates
        cryptsetup-bin
        e2fsprogs
        iproute2
WithDocs=no
CleanPackageMetadata=yes
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/locale
        /usr/share/lintian
        /usr/share/bug
        /var/cache
        /var/log
Hostname=vault
Locale=C.UTF-8
Timezone=UTC
RootShell=/usr/sbin/nologin

[Build]
Incremental=no
