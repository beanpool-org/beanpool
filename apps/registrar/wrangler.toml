# Beanpool node-address registrar — Cloudflare Worker (fetch + scheduled).
# Deploy: the "Registrar deploy" GitHub workflow (.github/workflows/registrar-deploy.yml, run by hand), which applies
# migrations/ with `wrangler d1 migrations apply --remote`, deploys with `--var GIT_SHA:<commit>` (answered by /health),
# and checks the live Worker. First-time D1 setup: `wrangler d1 create beanpool-registrar`, paste the returned
# database_id below, then `wrangler d1 migrations apply beanpool-registrar --remote` (a NEW database only — the live
# one needs scripts/bootstrap-d1-migrations.sql first; see README "Schema and migrations").

name = "beanpool-registrar"
main = "src/worker.js"   # src/index.js, and the ReplyTokens entrypoint apps/feedback binds (src/worker.js)
compatibility_date = "2025-06-01"

# Two cron entries, each its own invocation (src/index.js scheduled): the attestation sweep every 5 minutes, and the
# outside checks of our servers (src/watch.js) 2 minutes after each sweep. Apart, because one invocation may have only
# 6 connections waiting for headers (a 7th is queued) and one budget of subrequests: a server of ours that hangs must
# never hold what the sweep needs.
[triggers]
crons = ["*/5 * * * *", "2-57/5 * * * *"]

# Public, non-secret config.
[vars]
BASE_DOMAIN = "beanpool.org"
DNS_RECORD_CAP = "200"              # Cloudflare Free plan zone record cap (Pro is 1,000)
DNS_RECORD_ALERT_PCT = "80"         # Alert threshold percentage when zone capacity is near full
RELEASE_COOLOFF_S = "2592000"   # 30 days: an owner-released name is held this long for the same key only
                                # (design D3), then free. An admin release frees at once.
# The live limits are NOT here (Marty, 2026-10-18: open code, private settings). Names per key, the budgets of new names
# (across all nodes, per source, per network), probation, the sweep's strikes and the DNS zone's capacity are rows in the
# D1 `settings` table, edited in /admin ("New names, last 24 h" → Limits); the code holds only safe defaults
# (src/settings.js). A self-hoster with no /admin may set CLAIM_LIMIT_PER_KEY, NEW_NAMES_PER_HOUR, NEW_NAMES_PER_DAY,
# ATTEST_FAIL_LIMIT, SWAP_FAIL_LIMIT or CAPACITY here; a D1 row beats them.
# Reply links in notices (design §3.2, src/index.js replyBase): where a notice's one-use reply link points, the token
# appended. apps/feedback serves that page (GET/POST /reply/<token>) and asks this Worker through the ReplyTokens
# entrypoint (its wrangler.toml [[services]]). Uncomment once apps/feedback is deployed with that route and binding
# (apps/feedback/README.md "Reply links"): until then /admin offers no reply link and notices carry none. A self-hoster
# with no reply page leaves it unset.
# REPLY_URL = "https://beanpool.org/reply/"
# Circuit-breaker canary: one of OUR nodes, which must attest 'ok' in a sweep for that sweep to act on any
# row. Leave unset until that node is live in the registrar again (`test` was revoked 2026-09-24 and is
# `blocked` in name_policy) — a configured canary that isn't live suspends every sweep.
# CANARY_NAME = "test"

# The control room's outside checks (src/watch.js, design scratch/global-node/DESIGN-alerts-fable.md §2.3): our own
# servers, looked at every 5 minutes from this Worker — never from the server itself. Public facts only: each a name
# and the address anyone can reach it at. kind "vault" = the key vault (/v1/health and its signed /v1/report); any
# other is a node (/api/version and /api/community/health). Nobody else's server is ever watched.
WATCH_TARGETS = '''[
  {"name": "global", "url": "https://global.beanpool.org"},
  {"name": "vault", "url": "https://vault.beanpool.org", "kind": "vault"},
  {"name": "mullum", "url": "https://mullum.beanpool.org"},
  {"name": "castlemaine", "url": "https://castlemaine.beanpool.org"},
  {"name": "test", "url": "https://test.beanpool.org"}
]'''
# The public status line (src/status.js, design scratch/global-node/DESIGN-global-mothership-fable.md §3.2 U4, slice A8):
# the WATCH_TARGETS servers status.json shows at GET /api/registrar/status.json, which beanpool.org/status draws —
# comma-separated, in order; the registrar itself is always shown, last. OUR servers only: never a community's node
# (mullum, castlemaine) or name. Unset, only the registrar. Nothing is written without the STATUS binding below.
# Marty, 19 Oct 2026: the public page shows global and the registrar only (test is restarted too often to show strangers).
STATUS_SERVERS = "global"
# Who may use the control room (/admin and /api/local/admin/registrar/*, src/access.js): Cloudflare Access sits in
# front of those paths (app "BeanPool control room (registrar admin)", its own MFA: email code + authenticator), and the
# Worker believes only Access's signed token — this team's, for this app's AUD tag, naming an email listed here. With
# these set, ADMIN_SECRET opens nothing; set but incomplete, nobody gets in. These three are OUR registrar's: a
# self-hoster without Access deletes them and keeps ADMIN_SECRET (README "Admin sign-in"). Local dev: .dev.vars empties
# them, so `wrangler dev` signs in with its ADMIN_SECRET.
ACCESS_TEAM_DOMAIN = "tradeconnector.cloudflareaccess.com"
ACCESS_AUD = "9625a519de3357b3ceb3339024af0f9898f71a958b553c3aed071ca3978d60cc"
ADMIN_EMAILS = "martin@cytec.com.au"    # comma-separated
# The vault's ticket PUBLIC key(s), exactly as the apps are built with them (EXPO_PUBLIC_BEANPOOL_VAULT_TICKET_KEYS):
# 64 hex each, newest first, comma-separated, two at most. The vault's signed report is believed only under one of
# these. Unset, its report is "not checked" — never "fine" — and /admin and the daily line say so.
# VAULT_TICKET_KEYS = "<64 hex>"

# D1 binding — set database_id after `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "beanpool-registrar"
database_id = "165d8b11-fee8-4788-8ece-c632851e47d9"
# `wrangler d1 migrations` keeps what it applied in the table d1_migrations (its default).
migrations_dir = "migrations"

# KV binding for the public status line (src/status.js): one key, status.json, written at each watch tick (288 writes a
# day; Workers Free allows 1,000) and read by GET /api/registrar/status.json. Unbound, nothing is written and the GET
# answers 404 — the watch and the sweep are untouched. To turn it on (by hand, on the live account):
# `npx wrangler kv namespace create beanpool-status`, then uncomment these three lines with the id it prints.
# Created 2026-10-18 on the live account (beanpool-status).
[[kv_namespaces]]
binding = "STATUS"
id = "4cad86c733c24b9dbabc0f511342061a"

# Routes on the beanpool.org zone. The Worker intercepts these paths; the Pages static
# site continues to serve everything else. Uncomment + set zone_id at deploy time.
[[routes]]
pattern = "beanpool.org/api/registrar/*"
zone_name = "beanpool.org"
[[routes]]
pattern = "beanpool.org/api/local/admin/registrar/*"
zone_name = "beanpool.org"
[[routes]]
pattern = "beanpool.org/admin*"
zone_name = "beanpool.org"
[[routes]]
pattern = "beanpool.org/i/*"
zone_name = "beanpool.org"

# Secrets (NOT here — set with `wrangler secret put <NAME>`):
#   CF_API_TOKEN     scoped token: Account·Cloudflare Tunnel·Edit + Zone·DNS·Edit
#   CF_ACCOUNT_ID    151a28c4fd1e6ee09768f4226be76b4d
#   CF_ZONE_ID       060a99ae34e53b26dcf3be6578722b31
#   ADMIN_SECRET     shared secret for the admin endpoints — only while ACCESS_* above are unset (a registrar with no
#                    Cloudflare Access in front); with them set it opens nothing
#   NTFY_URL         the control room's ntfy topic, as a full URL (https://ntfy.sh/<topic>): the topic name IS the
#                    secret. Unset = no alerts are sent, and /admin says so (src/alerts.js).
#   NTFY_TOKEN       optional ntfy access token, sent as `Authorization: Bearer` (limits then follow the account,
#                    not Cloudflare's shared egress address)
#   SOURCE_KEY       32 random bytes, hex: the key a claim's connecting address is hashed under (HMAC-SHA-256) before
#                    anything keeps it (claim_sources, a day). The address itself is never stored. Unset = claims have
#                    no source, so no per-source budget applies and /admin cannot group or block by source.
