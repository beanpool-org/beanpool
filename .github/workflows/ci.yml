name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every pull request, not only those targeting main.
  #
  # `branches: [main]` meant a STACKED pr — one based on another feature branch — ran no
  # pipeline at all. That is not a rare shape here: #224 and #230 both sat reviewed, approved
  # and merge-ready having never been through CI once, and the only reason anybody noticed was
  # a manual check of the status rollup. A PR that cannot be verified should not look the same
  # as one that passed.
  #
  # The concurrency group below already cancels superseded runs, so the extra cost is one run
  # per stacked branch push.
  #
  # Every path but Markdown, except the guide's pages: they are Markdown, and a PR that changes
  # only them (every guide PR, since they no longer touch the published copies) must still get
  # the guide check. Later patterns win, so the last line puts them back.
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'packages/beanpool-guide/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Reading the repository is all this needs (the cache and the log upload use the runner's own token), so a compromised
# action or dependency on a push to main gets no write token. Every action is pinned to a full commit SHA with its
# version in a comment (scripts/check-workflows.mjs).
permissions:
  contents: read

jobs:
  test-all:
    name: Run BeanPool Test-All Pipeline
    runs-on: ubuntu-latest

    steps:
      # Two commits deep: the guide check (packages/beanpool-guide/scripts/build.mjs, findBase) compares
      # the published guide with the commit before HEAD — main before this push, or, for a pull request's
      # merge commit, main's tip — and fails when a shallow clone lacks it. A workflow_dispatch run on a
      # branch has no origin/main: when its tip is a merge, the check says the versions were not compared.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # The vault custodian tool's terminal test (apps/vault/src/__tests__/cli-terminal.test.ts) drives it on a pty with
      # expect; on CI the test fails rather than skips when expect is missing.
      - name: Install expect
        run: command -v expect || (sudo apt-get update && sudo apt-get install -y expect)

      # Chromium and its system libraries for test-all's browser checks (settings_phone, pwa_dark_classes,
      # native_phone_width, website_contrast, and website_status and website_lang after it), ONCE, before any check
      # starts. Each check used to run `playwright install --with-deps` itself, and apt lets one install hold dpkg's lock
      # at a time: on run 39768723431 settings_phone's took 5m29s on a slow mirror (25.9 MB at 78.8 kB/s), and
      # pwa_dark_classes and native_phone_width, started 2m23s and 2m32s in, failed in 8-9 s on that lock. The workspace
      # has one Playwright (1.63.0), so the PWA's install is every check's browser; their own `playwright install` then
      # finds it and downloads nothing.
      - name: Install Chromium for the browser checks
        run: pnpm --filter @beanpool/pwa exec playwright install --only-shell --with-deps chromium

      # A hang fails the step instead of holding the runner for GitHub's 6 h default. patches/vitest@3.2.7.patch drops
      # vitest's 60 s per-call rpc timer, as vitest 4 does: a test file whose import never finishes (a plugin transform
      # that never settles) now waits for this. The slowest green run of the last 59 took 72 min here; the median, 55.
      # At 115 min `timeout` signals test-all.sh and every check in it, so test-all.sh names the checks that had not
      # finished, prints the end of their logs and copies every log for the upload below. The step's 120 min cap is the
      # backstop: the runner's signal need not reach test-all.sh, and a run stopped by it leaves nothing to upload.
      - name: Run test-all checks
        timeout-minutes: 120
        env:
          # On failure, or when `timeout` stops it, test-all.sh copies every check log here; a passing run writes nothing.
          TEST_ALL_LOG_DIR: ${{ runner.temp }}/test-all-logs
        run: timeout -s INT 115m bash scripts/test-all.sh --all

      # The job output shows the failing package's own error, but only its last lines. The full
      # log of every check is here, so a failure never has to be re-run to be read.
      - name: Upload test-all logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-all-logs
          path: ${{ runner.temp }}/test-all-logs
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
