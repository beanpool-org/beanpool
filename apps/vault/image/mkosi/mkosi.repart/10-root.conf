# The read-only system partition (erofs), protected by dm-verity: its root hash is on the UKI's command line
# (roothash=), so the kernel refuses any block that isn't the one built. /var is not in it: the state partition is
# mounted there at boot (usr/lib/repart.d makes it at the first boot), so nothing that changes is ever hashed.
[Partition]
Type=root
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/efi/
ExcludeFiles=/boot/
ExcludeFiles=/tmp/
ExcludeFiles=/root/
ExcludeFiles=/home/
ExcludeFiles=/srv/
Verity=data
VerityMatchKey=root
# A fixed size, so that every later image fits either slot (usr/lib/repart.d makes the second at the first boot).
SizeMinBytes=1G
SizeMaxBytes=1G
Label=beanpool-vault_%A
