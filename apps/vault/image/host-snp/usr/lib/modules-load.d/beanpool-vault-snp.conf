# SEV-SNP host images only (build.sh --host <a sev-snp profile> lays image/host-snp/ over the image): the guest's
# driver for the chip's reports. It pulls in tsm (configfs-tsm's core); systemd mounts configfs at /sys/kernel/config
# (sys-kernel-config.mount, after modprobe@configfs). On a host without SNP the driver does not load, which is why only
# an SNP image carries this file.
sev-guest
