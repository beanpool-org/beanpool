<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Event card harness</title>
        <!--
          @beanpool/core's config.ts reads process.env at module scope, which has no meaning in a browser: on the
          Vite dev server that throws "process is not defined" before anything renders, for this harness and for
          the app's own "/" alike (measured 2026-09-24 — pre-existing, not this branch, and not a layout PR's to
          fix). A classic script runs before the deferred module below, so the shim is in place in time.
        -->
        <script>window.process = window.process || { env: {} };</script>
    </head>
    <body class="bg-oat-100 dark:bg-nature-950">
        <div id="root"></div>
        <script type="module" src="./event-card-harness.tsx"></script>
    </body>
</html>
