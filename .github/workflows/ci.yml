name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every pull request, not only those targeting main.
  #
  # `branches: [main]` meant a STACKED pr — one based on another feature branch — ran no
  # pipeline at all. That is not a rare shape here: #224 and #230 both sat reviewed, approved
  # and merge-ready having never been through CI once, and the only reason anybody noticed was
  # a manual check of the status rollup. A PR that cannot be verified should not look the same
  # as one that passed.
  #
  # The concurrency group below already cancels superseded runs, so the extra cost is one run
  # per stacked branch push.
  #
  # Every path but Markdown, except the guide's pages: they are Markdown, and a PR that changes
  # only them (every guide PR, since they no longer touch the published copies) must still get
  # the guide check. Later patterns win, so the last line puts them back.
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'packages/beanpool-guide/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Reading the repository is all this needs (the cache and the log upload use the runner's own token), so a compromised
# action or dependency on a push to main gets no write token. Every action is pinned to a full commit SHA with its
# version in a comment (scripts/check-workflows.mjs).
permissions:
  contents: read

jobs:
  # test-all.sh's checks split across parallel jobs (Fable test-throughput S3, 31 Oct 2026). One job ran them all in
  # 90-110 min on 4 vCPUs; each shard here runs a named part (TEST_ALL_ONLY) and the slowest sets the wall clock. Every
  # check is in exactly one shard, the vitest `test` check split by package and vitest --shard, the server suites by
  # SERVER_SUITES_SHARD over the committed durations in scripts/server-suite-durations.json. scripts/check-ci-shards.test.mjs
  # (test-all's `workflows` check) fails when a check is in no shard or two, or the server shards do not count to K.
  # fail-fast off: a red shard does not cancel the others, so one run names every failure.
  shard:
    name: Test-All shard ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server-1, checks: server_suites, server_shard: 1/6 }
          - { name: server-2, checks: server_suites, server_shard: 2/6 }
          - { name: server-3, checks: server_suites, server_shard: 3/6 }
          - { name: server-4, checks: server_suites, server_shard: 4/6 }
          - { name: server-5, checks: server_suites, server_shard: 5/6 }
          - { name: server-6, checks: server_suites, server_shard: 6/6 }
          - { name: settings-phone, checks: settings_phone, browser: true }
          - { name: vitest-native-1, checks: test, test_slice: "--only --filter=beanpool-pillar -- --shard=1/2" }
          - { name: vitest-native-2, checks: test, test_slice: "--only --filter=beanpool-pillar -- --shard=2/2" }
          - { name: vitest-pwa-1, checks: test, test_slice: "--only --filter=@beanpool/pwa -- --shard=1/2" }
          - { name: vitest-pwa-2, checks: test, test_slice: "--only --filter=@beanpool/pwa -- --shard=2/2" }
          - { name: vitest-rest, checks: test, test_slice: "--filter=!beanpool-pillar --filter=!@beanpool/pwa", expect: true, compare_main: true }
          - { name: web-pages, checks: "pwa_dark_classes pwa_wide_pages native_phone_width website_colours website_contrast website_status website_android website_start website_lang", browser: true }
          - { name: checks, checks: "build lint typecheck native_dark_contrast suite_registration tool_budgets deploy_preserve deploy_no_fleet_secrets deploy_health deploy_package fail_summary merge_gate undeclared_imports balance_writes migration_steps directory_register workflows no_google_fonts website_global_link website_links setup_backup token_scripts reddit_inbox words secrets_guard", compare_main: true }

    steps:
      # Two commits deep: on a push to main the guide, words and migration checks compare with the commit before HEAD,
      # main before this push, and the guide check fails when a shallow clone lacks it.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # The checks that compare with main (migration_steps and words in `checks`, the guide's versions in `vitest-rest`) need
      # origin/main and a merge base, and checkout writes no origin/main for a pull request or a branch: migration_steps
      # read as a pass in 0 s on every pull request. Both ends go 50 deep: a train branch's merge base is up to four merges
      # back from its tip, and main takes about 30 merges a day. Measured: 6 s here against 18 s for the checkout (200 deep
      # 17 s, the whole history 30 s), so only the shards that compare do it, and the whole history only if 50 did not reach
      # the merge base (a run re-run days later). A push to main has what it needs from the checkout.
      # scripts/check-ci-shards.test.mjs runs this step against a throwaway origin.
      - name: Fetch origin/main
        if: matrix.compare_main && github.event_name != 'push'
        run: |
          head=$(git rev-parse HEAD)
          main=+refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --depth=50 origin "$main" "$head"
          git merge-base origin/main HEAD > /dev/null || git fetch --no-tags --unshallow origin "$main" "$head"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0

      # The pnpm store is cached by lockfile (install measured 4-5 s with it); core, engine and signin are rebuilt in
      # each shard below, 10-15 s, which a dist cache would not beat by enough to be worth a stale dist.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # The vault custodian tool's terminal test (apps/vault/src/__tests__/cli-terminal.test.ts) drives it on a pty with
      # expect; on CI the test fails rather than skips when expect is missing. Vault's vitest is in vitest-rest.
      - name: Install expect
        if: matrix.expect
        run: command -v expect || (sudo apt-get update && sudo apt-get install -y expect)

      # Chromium and its system libraries for the browser checks, in the shards that run them, before any check starts:
      # apt lets one install hold dpkg's lock at a time, and checks each installing --with-deps side by side failed on it
      # (run 39768723431). The checks' own `playwright install` then finds it and downloads nothing.
      - name: Install Chromium for the browser checks
        if: matrix.browser
        timeout-minutes: 15
        run: pnpm --filter @beanpool/pwa exec playwright install --only-shell --with-deps chromium

      # Built once before the checks fan out, so two tsc processes never write packages/beanpool-core/dist at once
      # (PR #2533 run 40547765597).
      - name: Build core, engine, and signin
        run: pnpm turbo run build --filter=@beanpool/core --filter=@beanpool/engine --filter=@beanpool/signin

      # A shard is 10-20 min; at 50 `timeout` signals test-all.sh, which names the checks that had not finished and
      # keeps their logs for the upload below. The step's 55 min cap is the backstop.
      - name: Run test-all checks (${{ matrix.name }})
        timeout-minutes: 55
        env:
          TEST_ALL_ONLY: ${{ matrix.checks }}
          TEST_ALL_TEST_SLICE: ${{ matrix.test_slice }}
          SERVER_SUITES_SHARD: ${{ matrix.server_shard }}
          TEST_ALL_LOG_DIR: ${{ runner.temp }}/test-all-logs
        run: timeout -s INT 50m bash scripts/test-all.sh --all

      - name: Upload test-all logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-all-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/test-all-logs
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # THE REQUIRED CHECK. The "Protect main" ruleset requires a check named exactly "Run BeanPool Test-All Pipeline" and
  # matches it by name, so this job carries it and no other job may (scripts/check-ci-shards.test.mjs). It passes only when
  # every shard passed: a failed, cancelled or skipped shard fails it. always(), so it reports even then.
  test-all:
    name: Run BeanPool Test-All Pipeline
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

