# /var (etc/systemd/system/var.mount): the keyholder's sealed state file, the journal, Caddy's certificates, releases,
# staged images and (until the backup store's client exists) the local backups. Sized for the monthly restart's
# worst moment, measured on a build (#1314 round 2): a new image is 1.11 GiB (system partition 1 GiB, verity tree
# 64 MiB, UKI 49.5 MiB), and it is there twice while root checks it (the API's inbox and root's own copies): 2.22 GiB.
# The journal takes up to 200 MiB (journald.conf.d), the local backups up to 1 GiB (api.json backupMaxBytes) plus the
# one being written, a restore waiting one more, and releases, certificates and state a few MiB. That is about 3.7 GiB.
# Measured on the booted test image: the file system is 5.82 GiB, 5.79 GiB of it free for the vault's users after a
# genesis (no blocks kept back for root): ~2.1 GiB to spare.
[Partition]
Type=linux-generic
Label=vault-state
Format=ext4
SizeMinBytes=6G
SizeMaxBytes=6G
