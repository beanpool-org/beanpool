# The vault's system users. None can log in (no shell, no password), and no person has an account.
#   vault-keyholder          runs the keyholder
#   vault-api                runs the launcher and the API
#   vault-keyholder-socket   may connect to the keyholder: the keyholder itself and vault-api
#   vault-api-socket         may connect to the API: vault-api and caddy
g vault-keyholder-socket -
g vault-api-socket -
u vault-keyholder -:vault-keyholder-socket "BeanPool vault keyholder" /nonexistent /usr/sbin/nologin
u vault-api -:vault-api-socket "BeanPool vault API" /nonexistent /usr/sbin/nologin
m vault-api vault-keyholder-socket
m caddy vault-api-socket
