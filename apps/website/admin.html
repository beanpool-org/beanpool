<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanPool DNS & Tunnel Registrar — Super Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-card {
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            margin-bottom: 2rem;
        }
        .admin-input {
            width: 100%;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.9rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }
        .admin-table th {
            padding: 0.75rem 1rem;
            background: rgba(17, 24, 39, 0.6);
            color: var(--text-muted);
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .btn-approve {
            background: #10b981;
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-approve:hover { background: #059669; }
        .btn-revoke {
            background: #ef4444;
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-revoke:hover { background: #dc2626; }
        .badge-mode {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
            text-transform: uppercase;
        }
        .badge-tunnel { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
        .badge-direct { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem;">
        <header style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="/bean.png" alt="BeanPool Logo" style="width: 48px; height: 48px; object-fit: contain;">
                <div>
                    <h1 style="font-family: var(--font-header); font-size: 1.5rem; color: #fff;">Super Admin — Registrar Control</h1>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Manage DNS subdomains & Cloudflare Tunnels for beanpool.org</p>
                </div>
            </div>
            <a href="/" class="btn" style="padding: 0.5rem 1rem; border-radius: 9999px; text-decoration: none; color: var(--text-secondary); background: rgba(255,255,255,0.05);">← Back to site</a>
        </header>

        <!-- Admin Auth Card -->
        <div class="admin-card">
            <h2 style="font-size: 1rem; font-family: var(--font-header); margin-bottom: 0.75rem; color: var(--accent);">🔑 Super Admin Credentials</h2>
            <div style="display: flex; gap: 0.75rem; align-items: center;">
                <input type="password" id="adminSecretInput" class="admin-input" placeholder="Enter ADMIN_SECRET key..." style="flex: 1;">
                <button id="saveSecretBtn" class="btn btn-approve" style="white-space: nowrap;">Save & Connect</button>
            </div>
            <p id="secretStatus" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;"></p>
        </div>

        <!-- Pending Claims Card -->
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="font-size: 1.1rem; font-family: var(--font-header); color: #fbbf24;">⏳ Pending Name Claims (Awaiting Your Approval)</h2>
                <button id="refreshBtn" class="btn" style="padding: 0.35rem 0.8rem; font-size: 0.8rem; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;">🔄 Refresh</button>
            </div>

            <div id="pendingTableContainer">
                <p style="color: var(--text-muted); font-size: 0.85rem;">Loading claims...</p>
            </div>
        </div>

        <!-- Active Allocations Card -->
        <div class="admin-card">
            <h2 style="font-size: 1.1rem; font-family: var(--font-header); color: #10b981; margin-bottom: 1rem;">🌐 Active Subdomain & Tunnel Allocations</h2>
            <div id="activeTableContainer">
                <p style="color: var(--text-muted); font-size: 0.85rem;">Loading active allocations...</p>
            </div>
        </div>
    </div>

    <script>
        const secretInput = document.getElementById('adminSecretInput');
        const saveBtn = document.getElementById('saveSecretBtn');
        const statusText = document.getElementById('secretStatus');
        const refreshBtn = document.getElementById('refreshBtn');

        const savedSecret = localStorage.getItem('bp_registrar_admin_secret');
        if (savedSecret) {
            secretInput.value = savedSecret;
            statusText.textContent = 'Key loaded from browser storage.';
        }

        saveBtn.addEventListener('click', () => {
            const val = secretInput.value.trim();
            if (val) {
                localStorage.setItem('bp_registrar_admin_secret', val);
                statusText.textContent = 'Saved!';
                statusText.style.color = '#10b981';
                loadRegistrarData();
            }
        });

        refreshBtn.addEventListener('click', () => loadRegistrarData());

        async function loadRegistrarData() {
            const secret = secretInput.value.trim();
            if (!secret) {
                document.getElementById('pendingTableContainer').innerHTML = '<p style="color: #f87171;">Please enter your ADMIN_SECRET above to view claims.</p>';
                document.getElementById('activeTableContainer').innerHTML = '<p style="color: #f87171;">Please enter your ADMIN_SECRET above.</p>';
                return;
            }

            try {
                const res = await fetch('/api/local/admin/registrar/pending', {
                    headers: { 'x-admin-secret': secret }
                });

                if (res.status === 401) {
                    statusText.textContent = 'Invalid ADMIN_SECRET key.';
                    statusText.style.color = '#ef4444';
                    return;
                }

                const data = await res.json();
                const allocs = data.allocations || [];

                const pending = allocs.filter(a => a.status === 'pending');
                const active = allocs.filter(a => a.status !== 'pending' && a.status !== 'revoked');

                renderPending(pending);
            } catch (err) {
                console.error(err);
                document.getElementById('pendingTableContainer').innerHTML = `<p style="color: #f87171; font-size: 0.85rem;">Registrar Worker API unreachable (HTTP ${err.message || 'error'}). Ensure the <code>beanpool-registrar</code> Worker is deployed to Cloudflare with <code>wrangler deploy</code>.</p>`;
                document.getElementById('activeTableContainer').innerHTML = '<p style="color: #f87171; font-size: 0.85rem;">Registrar Worker API unreachable.</p>';
            }
        }

        function renderPending(pending) {
            const container = document.getElementById('pendingTableContainer');
            if (pending.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No pending name claims awaiting approval.</p>';
                return;
            }

            let html = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Domain Name</th>
                            <th>Node Pubkey</th>
                            <th>Mode</th>
                            <th>Requested</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            pending.forEach(claim => {
                const domain = claim.name + '.beanpool.org';
                const date = claim.requested_at ? new Date(claim.requested_at * 1000).toLocaleString() : '—';
                const pubkeyShort = claim.node_pubkey ? claim.node_pubkey.slice(0, 12) + '...' + claim.node_pubkey.slice(-8) : '—';

                html += `
                    <tr>
                        <td style="font-weight: 700; color: #fbbf24; font-family: monospace;">${domain}</td>
                        <td style="font-family: monospace; font-size: 0.75rem;">${pubkeyShort}</td>
                        <td><span class="badge-mode ${claim.mode === 'direct' ? 'badge-direct' : 'badge-tunnel'}">${claim.mode || 'tunnel'}</span></td>
                        <td style="font-family: monospace; font-size: 0.75rem;">${date}</td>
                        <td style="text-align: right;">
                            <button onclick="approveClaim('${claim.name}')" class="btn-approve">Approve</button>
                            <button onclick="revokeClaim('${claim.name}')" class="btn-revoke" style="margin-left: 0.4rem;">Reject</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderActive(active) {
            const container = document.getElementById('activeTableContainer');
            if (active.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No active allocations currently live.</p>';
                return;
            }

            let html = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Domain Name</th>
                            <th>Node Pubkey</th>
                            <th>Mode</th>
                            <th>Status</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            active.forEach(alloc => {
                const domain = alloc.name + '.beanpool.org';
                const pubkeyShort = alloc.node_pubkey ? alloc.node_pubkey.slice(0, 12) + '...' + alloc.node_pubkey.slice(-8) : '—';

                html += `
                    <tr>
                        <td style="font-weight: 700; color: #10b981; font-family: monospace;">${domain}</td>
                        <td style="font-family: monospace; font-size: 0.75rem;">${pubkeyShort}</td>
                        <td><span class="badge-mode ${alloc.mode === 'direct' ? 'badge-direct' : 'badge-tunnel'}">${alloc.mode || 'tunnel'}</span></td>
                        <td><span style="color: #10b981; font-weight: 600; font-size: 0.75rem; font-family: monospace;">🟢 ${alloc.status}</span></td>
                        <td style="text-align: right;">
                            <button onclick="revokeClaim('${alloc.name}')" class="btn-revoke">Revoke</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function approveClaim(name) {
            const secret = secretInput.value.trim();
            if (!confirm(`Approve ${name}.beanpool.org?`)) return;

            try {
                const res = await fetch(`/api/local/admin/registrar/${encodeURIComponent(name)}/approve`, {
                    method: 'POST',
                    headers: { 'x-admin-secret': secret }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`Approved ${name}.beanpool.org successfully!`);
                    loadRegistrarData();
                } else {
                    alert(`Approval failed: ${data.error || data.detail}`);
                }
            } catch (err) {
                alert(`Network error: ${err.message}`);
            }
        }

        async function revokeClaim(name) {
            const secret = secretInput.value.trim();
            if (!confirm(`Revoke/Reject ${name}.beanpool.org?`)) return;

            try {
                const res = await fetch(`/api/local/admin/registrar/${encodeURIComponent(name)}/revoke`, {
                    method: 'POST',
                    headers: { 'x-admin-secret': secret }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`Revoked ${name}.beanpool.org successfully.`);
                    loadRegistrarData();
                } else {
                    alert(`Revocation failed: ${data.error || data.detail}`);
                }
            } catch (err) {
                alert(`Network error: ${err.message}`);
            }
        }

        if (savedSecret) loadRegistrarData();
    </script>
</body>
</html>
