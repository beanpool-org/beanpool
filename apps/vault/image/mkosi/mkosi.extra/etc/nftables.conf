#!/usr/sbin/nft -f
# The vault's firewall (key vault design §3). In: HTTPS (443) and the certificate challenge (80), and what the network
# itself needs. Out: HTTPS only to addresses the vault's resolver has just returned for its allowed names
# (etc/beanpool-vault/dnsmasq.conf), DNS only from the resolver to Quad9, NTP only to the pool's addresses. The
# keyholder has no network at all (PrivateNetwork=yes). Everything else is dropped.
flush ruleset

table inet vault {
    set egress4 { type ipv4_addr; flags timeout; timeout 1h; }
    set egress6 { type ipv6_addr; flags timeout; timeout 1h; }
    set ntp4 { type ipv4_addr; flags timeout; timeout 1h; }
    set ntp6 { type ipv6_addr; flags timeout; timeout 1h; }

    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        tcp dport { 80, 443 } accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        udp dport 68 accept
        udp dport 546 accept
    }

    chain output {
        type filter hook output priority filter; policy drop;
        oif lo accept
        ct state established,related accept
        meta skuid "dnsmasq" ip daddr { 9.9.9.9, 149.112.112.112 } meta l4proto { tcp, udp } th dport 53 accept
        meta skuid "dnsmasq" ip6 daddr 2620:fe::fe meta l4proto { tcp, udp } th dport 53 accept
        meta skuid { "vault-api", "caddy" } tcp dport 443 ip daddr @egress4 accept
        meta skuid { "vault-api", "caddy" } tcp dport 443 ip6 daddr @egress6 accept
        meta skuid "systemd-timesync" udp dport 123 ip daddr @ntp4 accept
        meta skuid "systemd-timesync" udp dport 123 ip6 daddr @ntp6 accept
        udp dport 67 accept
        udp dport 547 accept
        ip6 nexthdr icmpv6 icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert, echo-reply, destination-unreachable, packet-too-big } accept
        ip protocol icmp icmp type { echo-reply, destination-unreachable } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
