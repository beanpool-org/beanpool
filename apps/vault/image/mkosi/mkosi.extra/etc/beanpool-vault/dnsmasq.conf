# The machine's resolver (beanpool-vault-dns.service). It answers every other name with "no such name", resolves only
# the names below (and their subdomains) through Quad9, and adds every address it answers with to the firewall's
# egress sets (etc/nftables.conf): the vault reaches nothing it hasn't just looked up here.
#
#   the providers' signing keys   www.googleapis.com, appleid.apple.com, www.facebook.com
#   Expo push                     exp.host
#   the release feed              api.github.com, github.com, release-assets.githubusercontent.com,
#                                 objects.githubusercontent.com
#   certificates (Caddy)          acme-v02.api.letsencrypt.org
#   time                          debian.pool.ntp.org
#   the custodians' backup store, webhook and mail server: none built in. Root's egress step
#                                 (beanpool-vault-egress.service) writes their names, from the settings two custodians
#                                 set, into /run/beanpool-vault-egress.conf, read here: the store and the webhook into
#                                 the HTTPS sets, the mail server into the mail sets (ports 465 and 587, the API only).
listen-address=127.0.0.1
bind-interfaces
port=53
user=dnsmasq
no-resolv
no-hosts
no-poll
cache-size=1000
local=/#/
server=/www.googleapis.com/appleid.apple.com/www.facebook.com/exp.host/github.com/githubusercontent.com/acme-v02.api.letsencrypt.org/debian.pool.ntp.org/9.9.9.9
server=/www.googleapis.com/appleid.apple.com/www.facebook.com/exp.host/github.com/githubusercontent.com/acme-v02.api.letsencrypt.org/debian.pool.ntp.org/149.112.112.112
nftset=/www.googleapis.com/appleid.apple.com/www.facebook.com/exp.host/github.com/release-assets.githubusercontent.com/objects.githubusercontent.com/acme-v02.api.letsencrypt.org/4#inet#vault#egress4,6#inet#vault#egress6
nftset=/debian.pool.ntp.org/4#inet#vault#ntp4,6#inet#vault#ntp6
conf-file=/run/beanpool-vault-egress.conf
