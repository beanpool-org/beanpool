name: Registrar deploy

# The registrar Worker (apps/registrar) and its D1 migrations, deployed from one commit and then checked live
# (design §5.2, scratch/registrar/DESIGN-2026-09-24-fable.md). The one-time setup (the `registrar-production`
# environment and its token) and the D1 bootstrap are in apps/registrar/README.md, "Deploy".
#
# WHO CAN DEPLOY is enforced by GitHub, not by this file (director's call, 2026-09-26). The deploy token is a secret of
# the `registrar-production` environment only, never a repository secret. That environment accepts runs from `main`
# only and waits for Marty's approval, and GitHub hands its secrets to no job before that approval, whatever a
# branch's copy of this file says. So a branch, a pull request, an edited copy of this workflow or another
# collaborator gets no token and deploys nothing. The manual trigger and the main-only step below are defence in
# depth. apps/registrar/scripts/check-deploy-workflow.mjs (the dry-run job and the registrar tests) keeps this
# file in that shape.
#
# MANUAL ONLY (director's call, 2026-09-25): no push trigger, no tag trigger. The design wanted it to follow every
# merge; to make it do that later, add `push: { branches: [main], paths: ['apps/registrar/**'] }` under `on:`, change
# the deploy job's `if:` to `github.event_name != 'pull_request'` and teach check-deploy-workflow.mjs the same. Every
# run would still wait for Marty's approval.
#
# The token is set only in the `env:` of the steps that run wrangler against Cloudflare (and of the check that it is
# set, before anything else runs), never for the job, so no action and no `pnpm install` script ever sees it. Every
# action is pinned to a full commit SHA, with its version in a comment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/registrar/**'
      - '.github/workflows/registrar-deploy.yml'

permissions:
  contents: read

jobs:
  # Every registrar pull request: what a deploy would upload, and the migrations on fresh local databases. No secret,
  # no environment, and no Cloudflare call.
  dry-run:
    name: Registrar dry run (no deploy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/registrar
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install wrangler (the workspace's)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @beanpool/registrar

      - name: The deploy job's environment, token scope and pinned actions
        run: node scripts/check-deploy-workflow.mjs

      - name: wrangler deploy --dry-run
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/registrar-dry-run" --var "GIT_SHA:$GITHUB_SHA"

      - name: Migrations (a fresh local database)
        run: npx --no-install wrangler d1 migrations list beanpool-registrar --local --persist-to "$RUNNER_TEMP/d1-list"

      - name: Migrations and the bootstrap (local databases only)
        run: node scripts/check-migrations.mjs

  deploy:
    name: Deploy the registrar
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only way to the deploy token. The environment accepts `main` only and waits for Marty's approval; the job
    # starts, and can read the environment's secret, only once he approves (README, Deploy, one-time setup).
    environment: registrar-production
    # One deploy at a time; a second waits rather than cancelling one half way through its migrations.
    concurrency:
      group: registrar-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/registrar
    env:
      CLOUDFLARE_ACCOUNT_ID: 151a28c4fd1e6ee09768f4226be76b4d
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Deploy from main only
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::the registrar deploys from main only; this run is on $GITHUB_REF"
          exit 1

      - name: The deploy token is set
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::environment registrar-production has no secret CLOUDFLARE_WORKERS_TOKEN (apps/registrar/README.md, Deploy, one-time setup)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0

      # No dependency cache: the deploy installs from the registry against the lockfile's hashes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install wrangler (the workspace's)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @beanpool/registrar

      # `wrangler d1 migrations apply` on a database whose d1_migrations doesn't record 0001 would run 0001 against
      # the live data. Read-only; fails when the table is missing, empty, or lacks 0001_init.sql.
      - name: The live database is bootstrapped
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: |
          if ! npx --no-install wrangler d1 execute beanpool-registrar --remote --json \
                 --command "SELECT name FROM d1_migrations ORDER BY id" > "$RUNNER_TEMP/d1_migrations.json"; then
            cat "$RUNNER_TEMP/d1_migrations.json"
            echo "::error::could not read d1_migrations on the live database: run scripts/bootstrap-d1-migrations.sql once (apps/registrar/README.md)"
            exit 1
          fi
          node scripts/deploy-checks.mjs bootstrapped < "$RUNNER_TEMP/d1_migrations.json"

      # wrangler lists them in directory order; apply runs them by number.
      - name: Pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: npx --no-install wrangler d1 migrations list beanpool-registrar --remote

      # Before the Worker: every migration so far is one the old Worker keeps working on.
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: npx --no-install wrangler d1 migrations apply beanpool-registrar --remote

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: npx --no-install wrangler deploy --var "GIT_SHA:$GITHUB_SHA"

      - name: The live Worker is this commit and accepts every protocol the node can send
        run: >-
          node scripts/deploy-checks.mjs health
          --url https://beanpool.org/api/registrar/health
          --commit "$GITHUB_SHA"
          --node-client ../server/src/services/registrar-client.ts
