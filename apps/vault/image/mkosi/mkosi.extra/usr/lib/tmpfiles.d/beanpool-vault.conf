# /var is the state partition, empty at the first boot: what the vault's services need on it.
d /var/lib/beanpool-vault              0755 root      root             -
# The data partition's mount point: root's while nothing is mounted there, so nothing the API's user writes before an
# unlock lands on the state partition under it (the mount would hide it, beyond root's clean-up at the custodians' restart). The mount's
# own top directory is the API's (usr/lib/beanpool-vault/vault-data.mjs). The ':' applies owner and mode only when
# the directory is made, so a later tmpfiles run never changes the mounted directory under the API.
d /var/lib/beanpool-vault/data         :0700 :root    :root            -
d /var/lib/beanpool-vault/releases     0700 vault-api vault-api-socket -
d /var/lib/beanpool-vault/backups      0700 vault-api vault-api-socket -
# A restore from backup waiting for the unlock (sealed under K_backup): off the data partition's mount point.
d /var/lib/beanpool-vault/restore      0700 vault-api vault-api-socket -
# The API's inbox for a new image: what it stages there is checked again by root at the custodians' restart.
d /var/lib/beanpool-vault/staged       0700 vault-api vault-api-socket -
# Where the API leaves a restart request two custodians signed (beanpool-vault-restart.path): root checks it.
d /var/lib/beanpool-vault/restart      0700 vault-api vault-api-socket -
# The custodians' settings (the off-box store, the alert channels), kept by the API, read by root's egress step; root's
# step at the custodians' restart keeps only the settings file there.
d /var/lib/beanpool-vault/settings     0700 vault-api vault-api-socket -
# The resolver's extra names for those settings (root's egress step rewrites it): there from the start, so the
# resolver starts whatever that step does.
f /run/beanpool-vault-egress.conf      0644 root      root             -
# Root's alone: the checked image systemd-sysupdate installs from, and root's copies while it checks them.
d /var/lib/beanpool-vault/install      0700 root      root             -
d /var/lib/beanpool-vault/install.work 0700 root      root             -
d /var/lib/caddy                       0700 caddy     caddy            -
d /var/log/journal                     2755 root      systemd-journal  -
