x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  beanpool-node:
    image: ghcr.io/beanpool-org/beanpool-node:${BEANPOOL_IMAGE_TAG:-latest}
    build:
      context: .
      network: host
    ports:
      - "80:8080" # Standard HTTP (for QR poster)
      - "443:8443" # Standard HTTPS (clean URLs)
      - "8080:8080" # Legacy HTTP (fallback while Azure NSG is updated)
      - "8443:8443" # Legacy HTTPS (fallback while Azure NSG is updated)
    environment:
      - PUBLIC_IP=${PUBLIC_IP}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BEANPOOL_DATA_DIR=/data
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ZONE_ID=${CF_ZONE_ID}
      - CF_RECORD_NAME=${CF_RECORD_NAME}
      - PUBLIC_ADDRESS_AUTO=${PUBLIC_ADDRESS_AUTO:-0}
      - PUBLIC_ADDRESS_NAME=${PUBLIC_ADDRESS_NAME:-}
      # Cutover: role / backup / enforcement (Phase 1 + SRV-20). Empty defaults =
      # primary role, backup puller off, READ AUTH ON (private reads need a member
      # signature; set ENFORCE_READ_AUTH=false to opt out), live-updates feed for
      # members only (/ws gives a socket without a member signature nothing but
      # public doorbells; ENFORCE_WS_AUTH=true refuses those sockets outright,
      # ENFORCE_WS_AUTH=false reopens the old feed to anyone), ledger auth off.
      # Set per node via the node-local .env (preserved across redeploys by
      # deploy.sh). See docs/SECURITY-CUTOVER-CHECKLIST.md.
      - NODE_ROLE=${NODE_ROLE:-}
      - BACKUP_PRIMARY_URL=${BACKUP_PRIMARY_URL:-}
      # A standby copies with BACKUP_REPLICATION_TOKEN. BACKUP_ADMIN_PASSWORD is legacy: a standby
      # that still has it swaps it for a token on start where it safely can, and warns otherwise.
      - BACKUP_REPLICATION_TOKEN=${BACKUP_REPLICATION_TOKEN:-}
      - BACKUP_ADMIN_PASSWORD=${BACKUP_ADMIN_PASSWORD:-}
      - BACKUP_PULL_INTERVAL_MS=${BACKUP_PULL_INTERVAL_MS:-}
      - ENFORCE_READ_AUTH=${ENFORCE_READ_AUTH:-}
      - ENFORCE_WS_AUTH=${ENFORCE_WS_AUTH:-}
      - ENFORCE_LEDGER_AUTH=${ENFORCE_LEDGER_AUTH:-}
      # What kind of node this is. EMPTY = local, a community with its own ledger, which is every node but one.
      # `global` is for the worldwide lobby. Read at every boot, never taken from a restored backup; the
      # switches it flips, and which are built yet, are in apps/server/src/config/node-profile.ts.
      - NODE_PROFILE=${NODE_PROFILE:-}
      # The oldest app build this node works with; phones below it see a banner they can't dismiss. EMPTY = the
      # built-in floor, far below anything in the field (apps/server/src/app-store-versions.ts).
      - MIN_APP_VERSION=${MIN_APP_VERSION:-}
      # Apple `sub` parity probe (temporary — see routes/apple-probe.ts). Empty
      # default = the probe pages are not registered at all, which is what every
      # node except the one being tested should have. APPLE_DOMAIN_ASSOCIATION is
      # separate on purpose: Apple re-verifies domains on its own schedule, so the
      # association file must keep serving after the probe flag is switched off.
      - APPLE_PROBE=${APPLE_PROBE:-}
      - APPLE_SERVICES_ID=${APPLE_SERVICES_ID:-}
      - APPLE_DOMAIN_ASSOCIATION=${APPLE_DOMAIN_ASSOCIATION:-}
      - APPLE_PROBE_REDIRECT_URI=${APPLE_PROBE_REDIRECT_URI:-}
      # Federation (#143). Both EMPTY by default, which is off — the state every node ships in and stays in
      # until an operator opts that node in through its own preserved .env. Neither was passed through here
      # before, so the flags existed in the code and could not be set on a deployed node at all: federation
      # was unreachable in production for want of two lines, which is why nothing has ever exercised it
      # between two real nodes.
      #
      # They are separate switches on purpose. ENABLE_PEER_CONNECTORS decides whether this node talks to
      # peers at all; FEDERATION_SETTLEMENT decides whether it accepts NEW cross-node trades, and turning
      # that one back off still finishes trades already in flight (federation-settlement.ts).
      - ENABLE_PEER_CONNECTORS=${ENABLE_PEER_CONNECTORS:-}
      - FEDERATION_SETTLEMENT=${FEDERATION_SETTLEMENT:-}
      # Extra proxies whose forwarding headers (CF-Connecting-IP / X-Forwarded-For) name the real client, as
      # comma-separated IPs or CIDRs. EMPTY is right for almost every node: loopback, the docker networks this
      # container is on (where cloudflared connects from) and Cloudflare's edge are trusted already. Only for a
      # reverse proxy on ANOTHER host. See apps/server/src/client-ip.ts.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # The Pulse OAuth Credentials
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      # Diagnostics: on SIGUSR2 (sent by the host watchdog when a node's event
      # loop hangs) Node writes a diagnostic report — including the blocked JS
      # stack — to /data (persisted), so a freeze like 2026-07-18 is diagnosable
      # instead of erased by the restart. Also dumps a report on any uncaught
      # exception. No effect on normal operation. See ops/watchdog/.
      # --report-exclude-env keeps the environment OUT of every one of those
      # reports, because /data is what an owner copies and hands to a stranger
      # for help and the variables below include ADMIN_PASSWORD and CF_API_TOKEN.
      # The server also sets this from code (apps/server/src/report-privacy.ts);
      # the flag is here because it is the only form that reaches a WORKER
      # thread's copy of the setting, and it is on from the first instruction
      # rather than from the first import. Supported since Node 22.13; the image
      # is node:22-alpine3.21 (22.21.1), measured.
      - NODE_OPTIONS=--max-old-space-size=512 --report-on-signal --report-directory=/data --report-uncaught-exception --report-exclude-env
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - beanpool-shared
    restart: unless-stopped
    logging: *default-logging

  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token-file /data/tunnel-token
    volumes:
      - ./data:/data:ro
    # NOTE: cloudflared must NOT join beanpool-shared — all node stacks use the
    # same service name "beanpool-node", so Docker DNS round-robins across them.
    # Keeping cloudflared on the project-default network ensures it always routes
    # to this stack's node only.
    restart: unless-stopped
    logging: *default-logging

networks:
  beanpool-shared:
    external: true
