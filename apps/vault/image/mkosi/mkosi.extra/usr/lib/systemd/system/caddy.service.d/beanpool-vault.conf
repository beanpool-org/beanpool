# Caddy on the vault: after the resolver and firewall, in the API socket's group, and with nothing it doesn't need.
[Unit]
Wants=beanpool-vault-dns.service
After=beanpool-vault-dns.service nftables.service network-online.target

[Service]
SupplementaryGroups=vault-api-socket
LimitCORE=0
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
